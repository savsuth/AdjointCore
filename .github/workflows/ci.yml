name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: cargo test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pyo3 links libpython when the extension-module feature is off, which
      # it is for cargo test, so the test binaries need a Python shared
      # library they can find at run time.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release
        env:
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib

  wheel:
    name: maturin build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        run: |
          python -m pip install "maturin>=1.7,<2.0"
          maturin build --release --out dist
      - name: Install and import the wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import adjoint_core; r = adjoint_core.mc_pricer_buckets(100.0, 100.0, 0.05, [0.2, 0.25], 1.0, 1000); assert len(r['vegas']) == 2, r"
