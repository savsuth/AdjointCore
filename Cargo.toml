[package]
name = "adjoint-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "adjoint_core"
# cdylib for the PyO3 extension module, rlib so `cargo test` can link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
bumpalo = { version = "3.20.3", features = ["collections"] }
pyo3 = { version = "0.29.2", features = ["abi3-py39"] }
rand = "0.8.5"
rand_distr = "0.4.3"

[features]
# Enabled by maturin when building the Python wheel. Left off for `cargo test`,
# where linking against libpython is neither available nor wanted.
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
